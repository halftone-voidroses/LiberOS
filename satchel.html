<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,">
  <title>Satchel — Riason</title>
  <link rel="stylesheet" href="styles/room.css"/>
  <link rel="stylesheet" href="styles/machine.css"/>
  <link rel="stylesheet" href="styles/bezel.css"/>
  <link rel="stylesheet" href="styles/scars.css"/>
  <link rel="stylesheet" href="src/features/satchel/satchel.css"/>
  <link rel="stylesheet" href="styles/shadow.css"/>
  <link rel="stylesheet" href="styles/fate.css"/>
  <link rel="stylesheet" href="styles/hijack.css"/>
</head>
<body>
  <canvas class="dust-canvas" aria-hidden="true"></canvas>
  <canvas class="static-canvas" aria-hidden="true"></canvas>

  <div class="room">
    <div class="machine">
      <div class="bezel">
        <div class="carvings" id="carvings"></div>
        <div class="vent-slits" aria-hidden="true"></div>
        <div class="corruption-scars" aria-hidden="true">
          <div class="scar scar-1"></div>
          <div class="scar scar-2"></div>
          <div class="scar scar-3"></div>
          <div class="scar scar-4"></div>
          <div class="scar scar-5"></div>
          <div class="scar scar-6"></div>
        </div>
        <div class="led" aria-hidden="true"></div>
        <div class="liber-plate">LIBER · VACUI</div>
        <div class="power-button" aria-hidden="true"></div>
        <div class="screw" aria-hidden="true"></div>

        <div class="screen">
          <div class="screen-stage">
            <header class="satchel-titlebar">
              <span class="satchel-titlebar-name">The Satchel</span>
              <span class="satchel-titlebar-sub">Write about your other self</span>
              <button class="satchel-help" type="button" id="satchel-help" aria-label="how this room works">?</button>
              <button class="satchel-exit" type="button" id="satchel-exit" aria-label="leave">×</button>
            </header>
            <div class="satchel-app" data-state="satchel">

              <div class="satchel-raison" id="satchel-raison" inert>
                <div class="satchel-raison-inner">
                  <div class="satchel-raison-head">
                    <span class="satchel-raison-name">riason</span>
                    <button class="satchel-raison-close" type="button" id="satchel-raison-close" aria-label="close">×</button>
                  </div>
                  <div class="satchel-raison-body">
                    three drawers on the left — buddies, artifacts, knots. click a tab, then an entry; write on the right. pens on the side.
                  </div>
                  
                </div>
              </div>

              <div class="satchel-binding">
                <div class="satchel-spine">
                  <div class="satchel-spine-text">RIASON</div>
                  <div class="satchel-spine-text">BOUND MMXXVI</div>
                </div>

                <div class="satchel-cabinet" id="satchel-cabinet">
                  <div class="satchel-drawers" id="satchel-drawers">
                    <div class="satchel-tabcards" role="tablist" aria-label="satchel drawers">
                      <button type="button" class="satchel-tab" data-tab="buddy" role="tab" aria-selected="true">buddy</button>
                      <button type="button" class="satchel-tab" data-tab="artifacts" role="tab" aria-selected="false">artifacts</button>
                      <button type="button" class="satchel-tab" data-tab="relations" role="tab" aria-selected="false">relations</button>
                    </div>
                    <div class="satchel-list" id="satchel-list" role="tabpanel"></div>
                  </div>

                  <div class="satchel-note" id="satchel-note">
                    <div class="satchel-note-head">
                      <div class="satchel-note-title" id="satchel-note-title">— — —</div>
                      <div class="satchel-note-date" id="satchel-note-date">— —</div>
                    </div>
                    <img class="satchel-polaroid" id="satchel-polaroid" alt="kept image" hidden />
                    <div class="satchel-intention" id="satchel-intention"></div>
                    <div class="satchel-editor" id="satchel-editor" contenteditable="true" spellcheck="false" aria-label="note"></div>
                    <div class="satchel-tools" id="satchel-tools" role="toolbar" aria-label="pens"></div>
                    <div class="satchel-stamp" aria-hidden="true">ex libris · liber vacui</div>
                  </div>
                </div>

                <div class="satchel-pop" id="satchel-pop" hidden>
                  <div class="satchel-pop-text" id="satchel-pop-text"></div>
                  <textarea class="satchel-pop-note" id="satchel-pop-note" rows="3" aria-label="note on this passage"></textarea>
                  <div class="satchel-pop-actions">
                    <button type="button" id="satchel-pop-save">keep</button>
                    <button type="button" id="satchel-pop-clear">unmark</button>
                    <button type="button" id="satchel-pop-close" aria-label="close">×</button>
                  </div>
                </div>

              </div>

            </div>
          </div>
        </div>
      </div>
      <div class="monitor-base" aria-hidden="true"></div>
    </div>
  </div>

  <script src="src/state.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/dust.js"></script>
  <script src="src/static.js"></script>
  <script src="src/shadow.js"></script>
  <script src="src/carvings.js"></script>
  <script src="data/fate.data.js"></script>
  <script src="src/fate.js"></script>
  <script src="data/hijack.data.js"></script>
  <script src="src/hijack.js"></script>
  <script src="src/features/satchel/satchel.js"></script>
</body>
</html>
