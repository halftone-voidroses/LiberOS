<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d2"/>
      <stop offset="0.55" stop-color="#e8dcc0"/>
      <stop offset="1" stop-color="#cfc2a2"/>
    </linearGradient>
    <radialGradient id="crt" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.7" stop-color="#070707"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c261c"/>
      <stop offset="1" stop-color="#6e1810"/>
    </linearGradient>
  </defs>

  <!-- the fat beige bezel -->
  <rect x="64" y="64" width="896" height="896" rx="176" fill="url(#bezel)"/>
  <rect x="64" y="64" width="896" height="896" rx="176" fill="none" stroke="#b5a888" stroke-width="6"/>

  <!-- recessed CRT -->
  <rect x="144" y="144" width="736" height="656" rx="64" fill="url(#crt)"/>
  <rect x="144" y="144" width="736" height="656" rx="64" fill="none" stroke="#0b0b0b" stroke-width="10"/>

  <!-- the boot rectangle: black void, deep-red centre -->
  <rect x="372" y="352" width="280" height="216" rx="10" fill="url(#boot)"/>
  <rect x="372" y="352" width="280" height="216" rx="10" fill="none" stroke="#3c0c08" stroke-width="4"/>

  <!-- liber plate line under the screen -->
  <rect x="452" y="856" width="120" height="10" rx="5" fill="#b5a888"/>
  <rect x="452" y="856" width="120" height="10" rx="5" fill="none" stroke="#a49678" stroke-width="2"/>

  <!-- power led -->
  <circle cx="812" cy="861" r="9" fill="#8a1f18"/>
  <circle cx="812" cy="861" r="4" fill="#e0483a"/>

  <!-- vent slits -->
  <g fill="#c4b697">
    <rect x="196" y="852" width="60" height="8" rx="4"/>
    <rect x="268" y="852" width="60" height="8" rx="4"/>
    <rect x="340" y="852" width="60" height="8" rx="4"/>
  </g>
</svg>
