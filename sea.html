<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,">
  <title>Sea — Vanir</title>
  <link rel="stylesheet" href="styles/room.css"/>
  <link rel="stylesheet" href="styles/machine.css"/>
  <link rel="stylesheet" href="styles/bezel.css"/>
  <link rel="stylesheet" href="styles/scars.css"/>
  <link rel="stylesheet" href="src/features/sea/sea.css"/>
  <link rel="stylesheet" href="styles/shadow.css"/>
  <link rel="stylesheet" href="styles/fate.css"/>
  <link rel="stylesheet" href="styles/hijack.css"/>
</head>
<body>
  <canvas class="dust-canvas" aria-hidden="true"></canvas>
  <canvas class="static-canvas" aria-hidden="true"></canvas>

  <div class="room">
    <div class="machine">
      <div class="bezel">
        <div class="carvings" id="carvings"></div>
        <div class="vent-slits" aria-hidden="true"></div>
        <div class="corruption-scars" aria-hidden="true">
          <div class="scar scar-1"></div>
          <div class="scar scar-2"></div>
          <div class="scar scar-3"></div>
          <div class="scar scar-4"></div>
          <div class="scar scar-5"></div>
          <div class="scar scar-6"></div>
        </div>
        <div class="led" aria-hidden="true"></div>
        <div class="liber-plate">LIBER · VACUI</div>
        <div class="power-button" aria-hidden="true"></div>
        <div class="screw" aria-hidden="true"></div>

        <div class="screen">
          <div class="screen-stage">
            <header class="sea-titlebar">
              <span class="sea-titlebar-name">the sea</span>
              <span class="sea-titlebar-sub">vanir holds the tide</span>
              <button class="sea-help" type="button" id="sea-help" aria-label="how this room works">?</button>
              <button class="sea-exit" type="button" id="sea-exit" aria-label="leave">×</button>
            </header>
            <div class="sea-app" data-state="sea">

              <div class="sea-raison" id="sea-raison" inert>
                <div class="sea-raison-inner">
                  <div class="sea-raison-head">
                    <span class="sea-raison-name">riason</span>
                    <button class="sea-raison-close" type="button" id="sea-raison-close" aria-label="close">×</button>
                  </div>
                  <div class="sea-raison-body">
                    type what you carry, weigh how heavy it sits, and release it. the water takes it and does not keep it. breathe with it first if you like — slow in, slow out.
                  </div>
                  
                </div>
              </div>

              <div class="sea-deep">
                <div class="sea-vignette"></div>

                <div class="sea-far" id="sea-far" aria-hidden="true"></div>
                <div class="sea-near" id="sea-near" aria-hidden="true"></div>

                <div class="sea-glimmer" aria-hidden="true"></div>

                <div class="sea-question" id="sea-question">what do you carry to the deep?</div>
                <div class="sea-question-faint" aria-hidden="true">what do you carry to the deep?</div>

                <div class="sea-carried" id="sea-carried" aria-hidden="true"><span id="sea-carried-text"></span></div>

                <div class="sea-ritual" id="sea-ritual">
                  <input class="sea-input" id="sea-input" type="text" maxlength="140"
                         autocomplete="off" spellcheck="false" placeholder="name it, plain"
                         aria-label="what do you carry to the deep"/>
                  <div class="sea-ritual-label" id="sea-intensity-label">weigh it</div>
                  <div class="sea-intensity" id="sea-intensity" role="radiogroup" aria-labelledby="sea-intensity-label">
                    <button class="sea-intensity-dot" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="1" aria-label="weigh 1">1</button>
                    <button class="sea-intensity-dot" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="2" aria-label="weigh 2">2</button>
                    <button class="sea-intensity-dot" type="button" role="radio" aria-checked="true" tabindex="0" data-value="3" aria-label="weigh 3">3</button>
                    <button class="sea-intensity-dot" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="4" aria-label="weigh 4">4</button>
                    <button class="sea-intensity-dot" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="5" aria-label="weigh 5">5</button>
                  </div>
                  <button class="sea-release" id="sea-release" type="button" disabled>release</button>
                  <button class="sea-breath-toggle" id="sea-breath-toggle" type="button" aria-pressed="false">breathe with it</button>
                  <div class="sea-breath-phase" id="sea-breath-phase" aria-live="polite"></div>
                </div>

                <div class="sea-breath" id="sea-breath">
                  <div class="sea-breath-ring" id="sea-breath-ring"></div>
                </div>

                <div class="sea-gauge">
                  <div class="sea-gauge-ticks" id="sea-gauge-ticks" aria-hidden="true">
                    <span class="sea-fathom" data-tick="5">5</span>
                    <span class="sea-fathom" data-tick="4">4</span>
                    <span class="sea-fathom" data-tick="3">3</span>
                    <span class="sea-fathom" data-tick="2">2</span>
                    <span class="sea-fathom" data-tick="1">1</span>
                  </div>
                  <div class="sea-gauge-label">depth</div>
                </div>

                <div class="sea-kelp sea-kelp-1"></div>
                <div class="sea-kelp sea-kelp-2"></div>
                <div class="sea-kelp sea-kelp-3"></div>
              </div>

            </div>
          </div>
        </div>
      </div>
      <div class="monitor-base" aria-hidden="true"></div>
    </div>
  </div>

  <script src="src/state.js"></script>
  <script src="src/room-shell.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/soundscape.js"></script>
  <script src="src/dust.js"></script>
  <script src="src/static.js"></script>
  <script src="src/shadow.js"></script>
  <script src="src/apply-theme.js"></script>
  <script src="src/carvings.js"></script>
  <script src="data/fate.data.js"></script>
  <script src="src/fate.js"></script>
  <script src="data/hijack.data.js"></script>
  <script src="src/hijack.js"></script>
  <script src="src/features/sea/sea.js"></script>
  <script src="src/liberchat-mount.js"></script>
</body>
</html>
